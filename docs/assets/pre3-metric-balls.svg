<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="pre3-title pre3-desc">
  <title id="pre3-title">度量开球的包含与反正切压缩</title>
  <desc id="pre3-desc">左图的大方形为最大值度量的单位球，菱形为求和度量的单位球，小方形为最大值度量的半单位球。所有边界均不属于开球。右图把实直线上的正整数通过反正切映射到逐渐靠近但不达到圆周率除以二的点。</desc>
  <rect width="900" height="380" rx="16" fill="#f6f8f4"/>
  <g font-family="sans-serif" fill="#173e39">
    <text x="28" y="32" font-size="19" font-weight="600">开球形状不同，拓扑可以相同</text>
    <text x="466" y="32" font-size="19" font-weight="600">同样的局部开集，不同的完备性</text>
    <line x1="445" y1="20" x2="445" y2="360" stroke="#b4c4b9"/>
    <rect x="94" y="83" width="220" height="220" fill="#deebe1" stroke="#628b77" stroke-width="2" stroke-dasharray="7 4"/>
    <polygon points="204,83 314,193 204,303 94,193" fill="#bdd8cc" stroke="#256b5a" stroke-width="2" stroke-dasharray="7 4"/>
    <rect x="149" y="138" width="110" height="110" fill="#f1dba5" fill-opacity="0.72" stroke="#9d742c" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M65 193H344M204 57V327" fill="none" stroke="#435e55" stroke-width="1.2"/>
    <circle cx="204" cy="193" r="3.5" fill="#173e39"/>
    <text x="210" y="210" font-size="14">0</text>
    <text x="320" y="184" font-size="14">1</text>
    <text x="323" y="101" font-size="15">B∞(0,1)</text>
    <text x="282" y="252" font-size="15">B₁(0,1)</text>
    <text x="103" y="343" font-size="15">B∞(0,½) ⊆ B₁(0,1) ⊆ B∞(0,1)</text>
    <text x="104" y="365" font-size="13">虚线是开球边界，边界点不计入球内</text>
    <text x="474" y="75" font-size="16">实直线：n 向右增长</text>
    <path d="M495 123H850L840 118M850 123L840 128" fill="none" stroke="#435e55" stroke-width="2"/>
    <g fill="#256b5a">
      <circle cx="533" cy="123" r="4"/><circle cx="593" cy="123" r="4"/><circle cx="653" cy="123" r="4"/><circle cx="713" cy="123" r="4"/>
    </g>
    <text x="529" y="147" font-size="14">1</text><text x="589" y="147" font-size="14">2</text><text x="649" y="147" font-size="14">3</text><text x="709" y="147" font-size="14">4</text><text x="778" y="147" font-size="19">…</text>
    <path d="M660 170V208L655 200M660 208L665 200" fill="none" stroke="#9d742c" stroke-width="2"/>
    <text x="682" y="192" font-size="16">arctan</text>
    <text x="474" y="239" font-size="16">像区间：arctan n → π/2</text>
    <line x1="501" y1="271" x2="827" y2="271" stroke="#435e55" stroke-width="2"/>
    <g fill="#256b5a">
      <circle cx="664" cy="271" r="4"/><circle cx="731" cy="271" r="4"/><circle cx="761" cy="271" r="4"/><circle cx="777" cy="271" r="4"/><circle cx="797" cy="271" r="3"/><circle cx="809" cy="271" r="2.5"/>
    </g>
    <circle cx="827" cy="271" r="6" fill="#f6f8f4" stroke="#9d742c" stroke-width="2"/>
    <text x="493" y="296" font-size="14">0</text>
    <text x="650" y="296" font-size="14">π/4</text>
    <text x="814" y="296" font-size="14">π/2</text>
    <text x="501" y="332" font-size="15">右端点不在像区间中</text>
    <text x="501" y="357" font-size="15">序列是 ρ-Cauchy，却没有 ρ-极限</text>
  </g>
</svg>
