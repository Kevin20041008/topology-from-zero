<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 460" role="img" aria-labelledby="d1-title d1-desc">
  <title id="d1-title">常秩局部标准形：保留两个坐标，压去一个方向</title>
  <desc id="d1-desc">在m等于n等于3、秩为2的局部坐标例子中，源空间的每条第三坐标方向线段投影到二维参数区域的一个点，再嵌入目标空间的第三坐标为零的平面。图示只描述局部邻域。</desc>
  <defs>
    <marker id="d1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1020" height="460" rx="16" fill="#ffffff"/>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#172033">
    <text x="510" y="38" text-anchor="middle" font-size="24" font-weight="700">常秩 r = 2 的局部坐标示意</text>
    <text x="160" y="78" text-anchor="middle" font-size="19" font-weight="600">源：三个自由坐标</text>
    <text x="510" y="78" text-anchor="middle" font-size="19" font-weight="600">先投影</text>
    <text x="850" y="78" text-anchor="middle" font-size="19" font-weight="600">再包含到目标</text>
    <g stroke="#64748b" stroke-width="1.5" fill="none">
      <path d="M60 270 L240 270 L280 215 L100 215 Z"/>
      <path d="M60 155 L240 155 L280 100 L100 100 Z"/>
      <path d="M60 155 L60 270 M240 155 L240 270 M280 100 L280 215 M100 100 L100 215"/>
    </g>
    <path d="M60 270 L240 270 L280 215 L100 215 Z" fill="#eff6ff" fill-opacity="0.7"/>
    <g stroke="#2563eb" stroke-width="3">
      <path d="M110 140 L110 250 M157 140 L157 250 M204 140 L204 250"/>
    </g>
    <g fill="#2563eb">
      <circle cx="110" cy="198" r="5"/><circle cx="157" cy="198" r="5"/><circle cx="204" cy="198" r="5"/>
    </g>
    <text x="175" y="304" text-anchor="middle" font-size="18">(u₁, u₂, v)</text>
    <text x="175" y="334" text-anchor="middle" font-size="15" fill="#475569">蓝色短线：只改变 v</text>
    <path d="M310 196 L377 196" stroke="#334155" stroke-width="2" marker-end="url(#d1-arrow)"/>
    <text x="343" y="172" text-anchor="middle" font-size="16">π</text>
    <path d="M406 258 L566 258 L610 154 L450 154 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <g fill="#2563eb">
      <circle cx="465" cy="207" r="5"/><circle cx="510" cy="207" r="5"/><circle cx="555" cy="207" r="5"/>
    </g>
    <text x="510" y="304" text-anchor="middle" font-size="18">(u₁, u₂)</text>
    <text x="510" y="334" text-anchor="middle" font-size="15" fill="#475569">每条 v 方向线段变成一点</text>
    <path d="M636 196 L703 196" stroke="#334155" stroke-width="2" marker-end="url(#d1-arrow)"/>
    <text x="669" y="172" text-anchor="middle" font-size="16">i</text>
    <path d="M755 258 L909 258 L960 178 L806 178 Z" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="1.5" fill="none">
      <path d="M740 218 L980 218 M804.1 290 L895.9 146 M850 294 L850 105"/>
    </g>
    <g fill="#2563eb">
      <circle cx="812" cy="218" r="5"/><circle cx="855" cy="218" r="5"/><circle cx="898" cy="218" r="5"/>
    </g>
    <text x="984" y="224" font-size="15" fill="#475569">y₁</text>
    <text x="899" y="145" font-size="15" fill="#475569">y₂</text>
    <text x="862" y="118" font-size="15" fill="#475569">y₃</text>
    <text x="850" y="304" text-anchor="middle" font-size="18">(u₁, u₂, 0)</text>
    <text x="850" y="334" text-anchor="middle" font-size="15" fill="#475569">局部像位于平面 y₃ = 0</text>
    <text x="510" y="384" text-anchor="middle" font-size="19">ψ ∘ f ∘ φ⁻¹ = i ∘ π</text>
    <text x="510" y="419" text-anchor="middle" font-size="16" fill="#475569">坐标变换只在邻域内定义；此图不说明全局纤维或全局嵌入性。</text>
    <text x="510" y="445" text-anchor="middle" font-size="13" fill="#64748b">Topology from Zero · D1 原创局部标准形示意图</text>
  </g>
</svg>
