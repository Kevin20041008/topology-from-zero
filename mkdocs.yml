site_name: topology-from-zero
site_description: 从直观、定义到证明与计算的中文拓扑学开放教材
site_url: !ENV [SITE_URL, 'http://127.0.0.1:8000/']
repo_url: https://github.com/Kevin20041008/topology-from-zero
repo_name: Kevin20041008/topology-from-zero
edit_uri: edit/main/docs/
copyright: 原创教材 CC BY 4.0 · 代码 MIT · 数学审查状态见逐章记录
theme:
  name: material
  language: zh
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
nav:
  - 开始学习:
      - 首页: index.md
      - 选择路线: start/index.md
      - A · 零基础入门: start/beginner.md
      - B · 数学专业进阶: start/advanced.md
      - C · 计算与 AI: start/computational.md
      - 导论导读: introduction/index.md
      - 从距离到拓扑: introduction/01-spaces.md
      - 学习进度与范围: progress.md
  - 课程目录:
      - 课程地图: curriculum.md
      - 数学预备知识:
          - 'PRE1 · 集合、映射与等价类': preliminaries/sets-maps-relations.md
          - 'PRE2 · 证明与反例': preliminaries/proofs-counterexamples.md
          - 'PRE3 · 度量空间': preliminaries/metric-spaces.md
          - 'PRE4 · 可数性与选择': preliminaries/countability-choice.md
          - 'PRE5 · 群、模与整数商': preliminaries/groups-modules.md
      - 点集拓扑:
          - 课程导读: point-set/index.md
          - '基础 A · 拓扑基与子基': point-set/bases-subbases.md
          - 'PS1 · 子空间拓扑': point-set/subspaces.md
          - '02 · 连续映射与紧致性': point-set/02-continuity.md
          - 'P1 · 闭包、内部、边界与网': point-set/closure-nets.md
          - 'P2 · 分离公理与可数性': point-set/separation-countability.md
          - 'P3 · 任意积、箱拓扑与拓扑和': point-set/products-sums.md
          - '基础 B · 连通性': point-set/connectedness.md
          - '基础 D · 商空间': point-set/quotient-spaces.md
          - 'P4 · 紧致性、有限交性质与度量判据': point-set/compactness-metric.md
          - 'P6 · 局部紧致、紧化与适当映射': point-set/local-compactness.md
          - 'P7 · Urysohn 引理、Tietze 延拓与度量化': point-set/metrization-extension.md
          - 'P8 · 完备化、Baire 空间与不动点': point-set/completion-baire.md
          - 'P9 · 局部连通、仿紧致与单位分解': point-set/local-properties-partitions.md
          - 'P10 · 函数空间、紧开拓扑与 Arzelà–Ascoli': point-set/function-spaces.md
      - 代数拓扑 I:
          - 课程导读: algebraic/index.md
          - '基础 C · 同伦与基本群': algebraic/homotopy-fundamental-group.md
          - 'F1 · 基点变换、函子性与形变收缩': algebraic/fundamental-group/functor-basepoint.md
          - 'C1 · 覆盖映射、提升与圆周基本群': algebraic/covering/lifting-circle.md
          - 'F2 · van Kampen、图与胞腔表示': algebraic/fundamental-group/van-kampen.md
          - 'C2 · 提升判据、万有覆盖与覆盖分类': algebraic/covering/classification.md
      - 代数拓扑 II:
          - '代数预备 · 链群与线性商空间': algebraic/linear-algebra-primer.md
          - '03 · 环、边界与同调': algebraic/03-homology.md
          - 'H1 · 整数奇异链与同伦不变性': algebraic/homology/singular-chains.md
          - 'H2 · 相对同调、切除与 Mayer–Vietoris': algebraic/homology/exact-excision.md
          - 'H3 · 胞腔同调、挠与系数变换': algebraic/homology/cellular-coefficients.md
          - 'Q1 · 上链、泛系数与杯积环': algebraic/cohomology/cochains-products.md
          - 'Q2 · 定向、帽积与 Poincaré 对偶': algebraic/cohomology/duality.md
      - 微分拓扑:
          - 课程导读: differential/index.md
          - 'D1 · 光滑流形、切空间与秩定理': differential/manifolds-rank.md
          - 'D2 · 横截性、交叉与映射度': differential/transversality-degree.md
          - 'D3 · 微分形式、Stokes 与 de Rham 上同调': differential/forms-derham.md
          - 'D4 · Morse 函数、子水平集与柄': differential/morse-handles.md
          - 'D5 · 向量丛、截面与特征类入口': differential/bundles-characteristic.md
      - 几何拓扑与流形:
          - 课程导读: geometric/index.md
          - 'T1 · TOP、PL、DIFF 与三角剖分': geometric/categories-triangulations.md
          - 'T2 · 紧曲面分类与多边形计算': geometric/surfaces.md
          - 'T4 · 三维流形、Dehn 填充与配边': geometric/three-manifolds-surgery.md
      - 纽结理论（已有专题）: geometric/knots.md
      - 高阶同伦论（已有专题）: algebraic/graduate-tools.md
      - 集合论拓扑与维数（建设中）:
          - '已写 · 滤子与Tychonoff': point-set/filters-tychonoff.md
      - 计算拓扑:
          - 课程导读: computational/index.md
          - 'K1 · 边界算法': computational/boundary-algorithms.md
          - 'CT1 · Smith 标准形与整数同调': computational/integer-homology.md
      - 拓扑数据分析:
          - 课程导读: persistence/index.md
          - 'R1 · 持续模与约化': persistence/modules-reduction.md
          - 'R2 · 稳定性': persistence/stability.md
      - 拓扑与人工智能:
          - 课程导读: ai/index.md
          - 'A1 · 拓扑特征': ai/features-learning.md
          - 'A2 · 基线与评估': ai/evaluation-protocol.md
          - 'A3 · 拓扑损失': ai/topological-loss.md
          - 'A4 · 拓扑与图像分割': ai/segmentation-topology.md
          - 'A5 · 医学图像拓扑': ai/medical-topology.md
          - 'A6 · 高阶图神经网络': ai/higher-order-networks.md
          - 'A7 · 三维点云与形状学习': ai/point-cloud-learning.md
          - 'A8 · 可微持续同调': ai/differentiable-persistence.md
          - '项目 C · 可复现神经网络优化': ai/projects/topology-optimization.md
          - '项目 D · 真实二维图像与拓扑损失': ai/projects/image-topology.md
      - 习题与解答:
          - 使用方法: exercises/index.md
          - 八课证明工作坊: exercises/proof-workshop.md
          - PRE1完整解答: exercises/pre1-solutions.md
          - PRE2完整解答: exercises/pre2-solutions.md
          - PRE3完整解答: exercises/pre3-solutions.md
          - A3完整解答: exercises/a3-solutions.md
          - A4完整解答: exercises/a4-solutions.md
          - A5完整解答: exercises/a5-solutions.md
          - A6完整解答: exercises/a6-solutions.md
          - A7完整解答: exercises/a7-solutions.md
          - A8完整解答: exercises/a8-solutions.md
          - PRE4完整解答: exercises/pre4-solutions.md
          - PS1完整解答: exercises/ps1-solutions.md
          - PRE5完整解答: exercises/pre5-solutions.md
          - CT1完整解答: exercises/ct1-solutions.md
          - H2完整解答: exercises/h2-solutions.md
          - H3完整解答: exercises/h3-solutions.md
          - Q1完整解答: exercises/q1-solutions.md
          - Q2完整解答: exercises/q2-solutions.md
      - 参考书目: references.md
  - 交互实验:
      - 实验导读: labs/index.md
      - 基础实验台: labs/foundations.md
      - 覆盖空间与道路提升: labs/covering-space.md
      - AI 拓扑实验: labs/ai-topology.md
      - 三角形的洞: labs/triangle.md
      - 点云与持续同调: labs/point-cloud.md
      - 三维拓扑曲面: labs/surfaces.md
      - Python Notebook: notebooks.md
  - 开发者与审查:
      - 版本与部署证据: project/release-status.md
      - 定理证明依赖台账: project/proof-ledger.md
      - H3/Q1/Q2 专项审查: project/H3-Q1-Q2-REVIEW.md
      - 完整课程总计划: project/COURRICULUM_MASTER_PLAN.md
      - 先修依赖图: project/PREREQUISITE_GRAPH.md
      - 实施状态与续作: project/IMPLEMENTATION_STATUS.md
      - 数学审查协议: project/MATH_REVIEW_PROTOCOL.md
      - 人工数学审阅包: project/HUMAN_REVIEW_PACKET.md
      - 学习者测试协议: project/LEARNER_STUDY.md
      - 逐章审查: project/reviews/index.md
      - M0审计证据: project/AUDIT_M0.md
      - M1独立模型复核: project/M1_REVIEW.md
      - 基础审查历史: math-review.md
      - 研究生审查历史: graduate-review.md
      - 符号与术语: notation.md
      - 公式渲染检查: math-check.md
      - 本地运行与部署: development.md
      - 贡献与版权: contributing.md
not_in_nav: |
  /project/reviews/*.md
  /project/templates/*.md
plugins:
  - search:
      lang: [zh, en]
      jieba_dict_user: scripts/search-dictionary.txt
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
hooks:
  - scripts/build_metadata.py
extra_css:
  - stylesheets/extra.css
  - stylesheets/experiments.css
  - stylesheets/learning.css
  - stylesheets/proof-training.css
  - stylesheets/covering.css
extra_javascript:
  - javascripts/mathjax.js
  - assets/vendor/mathjax/tex-svg.js
  - path: javascripts/experiments.mjs
    type: module
  - path: javascripts/exercises.mjs
    type: module
  - path: javascripts/foundations-lab.mjs
    type: module
  - path: javascripts/ai-topology-lab.mjs
    type: module
  - path: javascripts/learning-paths.mjs
    type: module
  - path: javascripts/build-info.mjs
    type: module
  - path: javascripts/proof-training-ui.mjs
    type: module
  - path: javascripts/covering-lab.mjs
    type: module
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
