name: Build textbook and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify interactive topology algorithms
        run: npm test
      - name: Verify static proof workshop matches its reviewed bank
        run: node scripts/build_proof_workshop.mjs --check
      - name: Verify source inventory and HTML provenance regressions
        run: |
          python scripts/course_inventory.py --check
          python scripts/build_proof_ledger.py --check
          python scripts/test_build_metadata.py
      - run: python -m pip install -r requirements-validation.txt
      - run: python -m pip install -r requirements-integer.txt
      - name: Verify exact integer homology and independent Smith form
        run: |
          python scripts/test_integer_homology.py
          python scripts/verify_integer_independent.py
          python scripts/verify_foundation_examples.py
          python scripts/verify_algebra_chapter_examples.py
          python scripts/test_subdivision_chains.py
          python scripts/verify_homology_content.py
      - name: Install reproducible browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Compare with independent GUDHI persistence
        run: python scripts/verify_independent.py
      - name: Compare AI teaching models with GUDHI
        run: python scripts/verify_ai_independent.py
      - name: Execute original Python examples in AI chapters
        run: python scripts/verify_ai_examples.py
      - name: Execute and validate notebooks
        run: python scripts/verify_notebooks.py
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build documentation strictly
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'http://127.0.0.1:8000/' }}
        run: python -m mkdocs build --strict
      - name: Verify generated links, search, and math markup
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'http://127.0.0.1:8000/' }}
        run: python scripts/verify_site.py
      - name: Verify desktop and mobile course behavior
        run: npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, learning-project, image-project]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-deployment:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public HTML and manifest after CDN propagation
        run: python scripts/verify_deployment.py --base-url "${{ needs.deploy.outputs.page_url }}" --expected "${{ github.sha }}" --attempts 16 --interval 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-consistency
          path: deployment-check.json
  learning-project:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: projects/topology-optimization/requirements.txt
      - run: python -m pip install -r projects/topology-optimization/requirements.txt
      - name: Test gradients, topology and actual training
        run: python projects/topology-optimization/test_project.py
      - name: Run full fixed protocol in the CI environment
        run: python projects/topology-optimization/train.py --output project-results-ci
      - name: Verify and exactly rerun this environment's results
        run: python projects/topology-optimization/verify.py --results project-results-ci/raw-results.json --rerun
      - uses: actions/upload-artifact@v4
        with:
          name: learning-project-results
          path: project-results-ci/
  image-project:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: projects/image-topology/requirements.txt
      - run: python -m pip install -r projects/image-topology/requirements.txt
      - name: Verify cubical invariants, gradients and artifact integrity
        run: python projects/image-topology/test_project.py
      - name: Train six fixed real-image runs in this environment
        run: python projects/image-topology/train.py --output project-results-image-ci
      - name: Recompute metrics and exactly retrain this environment's evidence
        run: python projects/image-topology/verify.py --results project-results-image-ci/results.json --rerun
      - uses: actions/upload-artifact@v4
        with:
          name: image-project-results
          path: project-results-image-ci/
